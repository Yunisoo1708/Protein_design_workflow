binder_5YXH:
  input: 5YXH_split.cif
  # target = A16-108 and B113-151 (same 132 residues as the AF2/AF3 runs; 109-112 are unresolved in the structure)
  contig: "A16-108,/0,B113-151,/0,50-80"
  conditions:
    C_CRD:                       # keep the target's coordinates FIXED
      true:
        - select: "chain_id == 'A' or chain_id == 'B'"
    C_SEQ:                       # keep the target's sequence FIXED
      true:
        - select: "chain_id == 'A' or chain_id == 'B'"
    hotspot:
      true:
        - select: "res_id == 31 or res_id == 32 or res_id == 122 or res_id == 123"
